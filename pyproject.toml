[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desensitize"
version = "0.9.0"
description = "Make agent-friendly, PII-redacted copies of PDFs (SSN, address, phone, email, DOB, account IDs, names)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "clankerabuse" }]
keywords = ["pdf", "redaction", "redact", "desensitize", "de-identify", "pii",
            "privacy", "llm", "agents", "credit-report"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
desens = "desensitize.cli:main"
desensitize = "desensitize.cli:main"
pdf-redact = "desensitize.cli:main"   # legacy alias, pre-rename muscle memory

[project.urls]
Homepage = "https://github.com/clankerabuse/desensitize"

[tool.hatch.build.targets.wheel]
packages = ["src/desensitize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
