[package]
name = "desensitize-rs"
version = "0.9.0"
edition = "2021"
description = "Rust rewrite of desens: PII-redacted, agent-friendly copies of PDFs (text-layer milestone)"
license = "MIT"

# Transition layout: the Python package stays at src/desensitize/ until the
# Rust build reaches full parity (OCR, image regions, placeholders), then it
# moves aside and this crate becomes the shipped `desens` binary.
[[bin]]
name = "desens-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fancy-regex = "0.14"
libc = "0.2"
rayon = "1.10"
regex = "1.11"
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
