name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # the OCR tests run the real binary, and the crop-box test checks the copy
      # with the extractor it is meant to be safe for; skipping either would hide
      # regressions
      - name: Install tesseract and poppler
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest
